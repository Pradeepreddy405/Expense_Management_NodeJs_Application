
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Expense Tracker</h1>
        <p>Manage your daily expenses easily</p>
    </header>

    <main class="container">

        <section class="form-section">
            <h2>Add New Expense</h2>

            <form id="expenseForm">

                <div class="form-group">
                    <label for="title">Expense Title</label>
                    <input type="text" id="title" placeholder="Enter expense title" required>
                </div>

                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" placeholder="Enter amount" min="0.01" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="expense_date">Expense Date</label>
                    <input type="date" id="expense_date" required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" placeholder="Enter description"></textarea>
                </div>

                <button type="submit">Add Expense</button>

            </form>
        </section>

        <section class="expense-section">
            <h2>Expense History</h2>

            <div id="message"></div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Description</th>
                        </tr>
                    </thead>

                    <tbody id="expenseTableBody">
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
